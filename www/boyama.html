<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robi Boyama Atölyesi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#fff7e0;background-image:radial-gradient(#ffd16655 2px,transparent 2px);background-size:22px 22px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{border:3.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:16px;padding:4px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:#22b573;color:#fff;text-shadow:0 1px 0 var(--ink)}
/* bölüm seçimi */
#select{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
#select h1{margin:0;font-size:30px;color:#ff5ad8;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.top{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between;max-width:820px}
#levels{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;width:min(820px,100%);overflow-y:auto;padding:4px}
.lv{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:18px;padding:3px 0;line-height:1.05}
.lv small{display:block;font-size:11px;letter-spacing:-1px;color:#f5b400}
.lv i{display:block;font-style:normal;font-size:18px}
.lv.lock{background:#e9e5f2;color:#999}
.lv.done{background:#fff3c4}
.tier{grid-column:1/-1;font-weight:800;font-size:14px;text-align:left;margin-top:4px}
/* boyama ekranı */
#paint{position:fixed;inset:0;display:none;padding:8px;gap:10px}
#board{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#svgWrap{flex:1;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
#svgWrap svg{width:100%;height:100%}
#svgWrap .r{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
#svgWrap .ink{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;pointer-events:none}
#svgWrap .dot{fill:var(--ink);pointer-events:none}
.bar{display:flex;gap:6px;align-items:center}
.bar .t{font-weight:800;font-size:17px;flex:1}
#side{width:178px;display:flex;flex-direction:column;gap:8px}
#pal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;border:3.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px;padding:8px}
.c{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0}
.c.on{transform:scale(1.15) translateY(-2px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
#side .btn{width:100%}
#prog{height:14px;border:3px solid var(--ink);border-radius:8px;background:#eee;overflow:hidden}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff5ad8);transition:width .2s}
/* kutlama */
#party{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.45);z-index:10}
#party .box{background:#fff;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);border-radius:26px;padding:10px 18px 14px;text-align:center;width:min(560px,94vw);position:relative;overflow:hidden}
#party h2{margin:0;font-size:32px;color:#ff5ad8;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.stars{font-size:40px;letter-spacing:6px}
.stage{position:relative;height:150px;margin:4px auto 6px;width:100%}
.stage .robi{position:absolute;left:50%;top:10px;width:84px;margin-left:-42px;animation:jumpy .6s ease-in-out infinite}
.stage .an{position:absolute;font-size:38px;animation:hop .5s ease-in-out infinite}
@keyframes jumpy{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px) scale(1.1)}}
.arm{animation:wave .3s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes wave{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.conf{position:absolute;top:-20px;width:9px;height:13px;border:2px solid var(--ink);border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(540deg)}}
</style>
</head>
<body>
<div id="select">
  <div class="top"><button class="btn" id="back">🏠 Menü</button><h1>🎨 Boyama Atölyesi</h1><span class="btn" id="total">⭐ 0</span></div>
  <div id="levels"></div>
</div>
<div id="paint">
  <div id="board">
    <div class="bar"><button class="btn" id="toSel">◀ Bölümler</button><span class="t" id="title"></span><div id="prog" style="width:160px"><i></i></div></div>
    <div id="svgWrap"></div>
  </div>
  <div id="side">
    <div id="pal"></div>
    <button class="btn" id="undo">↩️ Geri al</button>
    <button class="btn" id="clear">🧽 Temizle</button>
    <button class="btn go" id="done">✅ Bitti!</button>
  </div>
</div>
<div id="party"><div class="box">
  <h2 id="pTitle">Harika boyadın!</h2>
  <div class="stars" id="pStars"></div>
  <div class="stage" id="stage"></div>
  <div id="pMsg" style="font-weight:800;margin-bottom:8px"></div>
  <div style="display:flex;gap:8px;justify-content:center"><button class="btn" id="again">🖌️ Tekrar boya</button><button class="btn go" id="next">Sonraki ▶</button></div>
</div></div>
<script src="ortak.js"></script>
<script>
const $ = id => document.getElementById(id);
const RO = window.RobiOrtak || { award: () => null, tick: () => Infinity, timeLeft: () => Infinity };
const COLORS = ['#e53935', '#ff7a2f', '#ffd166', '#22b573', '#2bd4c4', '#2e8bff', '#a259ff', '#ff5ad8', '#8b5a2b', '#ffffff', '#9aa3ad', '#2b2340'];
let AC = null;
function tone(f, d = .1, type = 'triangle', vol = .07, t0 = 0) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} }

// ---------- Resimler (10 resim × 4 zorluk = 40 bölüm) ----------
// r(): boyanabilir bölge, k(): çizgi, d(): siyah nokta
const r = s => `<g class="R">${s}</g>`;
const R = (tag, a) => `<${tag} class="r" fill="#fff" ${a}/>`;
const K = a => `<path class="ink" d="${a}"/>`;
const D = (x, y, rr = 5) => `<circle class="dot" cx="${x}" cy="${y}" r="${rr}"/>`;
const SKY = R('rect', 'x="0" y="0" width="400" height="210"'), GROUND = R('rect', 'x="0" y="210" width="400" height="90"');
const SUN = (x = 340, y = 55) => R('circle', `cx="${x}" cy="${y}" r="30"`) + K(`M${x} ${y - 42}v-12M${x} ${y + 42}v12M${x - 42} ${y}h-12M${x + 42} ${y}h12`);
const CLOUD = (x, y) => R('path', `d="M${x} ${y}a18 18 0 0 1 30-14a22 22 0 0 1 40 6a16 16 0 0 1 4 32h-70a16 16 0 0 1-4-24z"`);
const PICS = [
  { name: 'Ev', e: '🏠', draw: v => [
    v >= 2 ? SKY + GROUND : '', v >= 2 ? SUN() : '', v >= 3 ? CLOUD(40, 40) + CLOUD(170, 30) : '',
    R('rect', 'x="110" y="130" width="170" height="120"'), R('path', 'd="M95 132L195 55L295 132Z"'), R('rect', 'x="175" y="180" width="42" height="70" rx="6"'),
    v >= 1 ? R('rect', 'x="125" y="150" width="38" height="34"') + R('rect', 'x="230" y="150" width="38" height="34"') + R('rect', 'x="240" y="68" width="22" height="40"') : '',
    v >= 3 ? R('path', 'd="M175 250L150 300H245L217 250Z"') + R('rect', 'x="30" y="160" width="14" height="60"') + R('circle', 'cx="37" cy="150" r="30"') : '',
  ] },
  { name: 'Balık', e: '🐟', draw: v => [
    v >= 2 ? R('rect', 'x="0" y="0" width="400" height="300"') : '', v >= 2 ? R('circle', 'cx="330" cy="70" r="12"') + R('circle', 'cx="350" cy="40" r="8"') + R('circle', 'cx="315" cy="35" r="6"') : '',
    v >= 3 ? R('path', 'd="M40 300C20 240 70 230 50 170C80 220 60 250 75 300Z"') + R('path', 'd="M350 300C340 250 380 240 365 190C395 230 380 260 385 300Z"') + R('ellipse', 'cx="320" cy="230" rx="26" ry="14"') + R('path', 'd="M294 230l-18-12v24z"') : '',
    R('path', 'd="M265 150l70-50v100z"'), v >= 1 ? R('path', 'd="M110 150C120 95 200 85 265 150C200 215 120 205 110 150Z"') + R('path', 'd="M160 120C170 105 190 100 205 107L200 130Z"') + K('M190 112C200 150 200 170 188 192M225 120C235 150 234 170 225 185') : R('path', 'd="M110 150C120 95 200 85 265 150C200 215 120 205 110 150Z"'),
    R('path', 'd="M170 105C185 70 220 75 225 115Z"'), R('path', 'd="M180 195C190 225 215 225 220 190Z"'), R('circle', 'cx="145" cy="140" r="12"'), D(147, 140, 5),
  ] },
  { name: 'Ağaç', e: '🌳', draw: v => [
    v >= 2 ? SKY + GROUND : '', v >= 3 ? SUN(60, 55) + R('path', 'd="M300 60q10-10 20 0q10-10 20 0"') : '',
    R('path', 'd="M180 280L190 170H215L225 280Z"'), R('circle', 'cx="202" cy="125" r="80"'),
    v >= 1 ? R('circle', 'cx="165" cy="105" r="13"') + R('circle', 'cx="235" cy="120" r="13"') + R('circle', 'cx="200" cy="160" r="13"') + R('circle', 'cx="215" cy="80" r="13"') : '',
    v >= 3 ? [60, 110, 300, 345].map(x => R('circle', `cx="${x}" cy="265" r="11"`) + K(`M${x} 276v18`)).join('') : '',
  ] },
  { name: 'Robi', e: '🤖', draw: v => [
    v >= 2 ? R('rect', 'x="0" y="0" width="400" height="300"') : '', v >= 3 ? [[40, 40], [350, 60], [70, 240], [330, 250], [300, 30]].map(([x, y]) => R('path', `d="M${x} ${y - 14}l4 10l10 2l-8 7l2 11l-8-6l-8 6l2-11l-8-7l10-2z"`)).join('') : '',
    R('rect', 'x="140" y="55" width="120" height="85" rx="22"'), R('rect', 'x="150" y="150" width="100" height="85" rx="18"'), R('rect', 'x="165" y="235" width="26" height="45" rx="10"'), R('rect', 'x="210" y="235" width="26" height="45" rx="10"'),
    v >= 1 ? R('rect', 'x="157" y="75" width="86" height="40" rx="16"') + R('circle', 'cx="200" cy="30" r="12"') + K('M200 42v13') + R('rect', 'x="110" y="155" width="28" height="70" rx="12"') + R('rect', 'x="262" y="155" width="28" height="70" rx="12"') : R('circle', 'cx="180" cy="97" r="11"') + R('circle', 'cx="220" cy="97" r="11"'),
    v >= 1 ? R('circle', 'cx="180" cy="95" r="10"') + R('circle', 'cx="220" cy="95" r="10"') : '',
    v >= 2 ? R('rect', 'x="150" y="200" width="100" height="16"') + R('circle', 'cx="200" cy="178" r="12"') : '',
  ] },
  { name: 'Araba', e: '🚗', draw: v => [
    v >= 2 ? SKY + R('rect', 'x="0" y="225" width="400" height="75"') + K('M20 262h40M100 262h40M180 262h40M260 262h40M340 262h40') : '', v >= 3 ? SUN(60, 55) + CLOUD(250, 40) + R('rect', 'x="345" y="150" width="12" height="75"') + R('circle', 'cx="351" cy="135" r="28"') : '',
    R('path', 'd="M70 220V170Q75 155 95 152L130 150L160 110H260L295 150L330 155Q345 160 345 175V220Z"'), R('path', 'd="M168 120H210V150H145Z"'), R('path', 'd="M220 120H255L280 150H220Z"'),
    R('circle', 'cx="125" cy="222" r="28"'), R('circle', 'cx="290" cy="222" r="28"'),
    v >= 1 ? R('circle', 'cx="125" cy="222" r="11"') + R('circle', 'cx="290" cy="222" r="11"') + R('rect', 'x="328" y="170" width="16" height="12" rx="4"') + R('rect', 'x="70" y="172" width="14" height="12" rx="4"') + K('M215 152V210') : '',
  ] },
  { name: 'Çiçek', e: '🌸', draw: v => {
    const n = v >= 1 ? 8 : 5, pet = Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2; return R('ellipse', `cx="${200 + Math.cos(a) * 52}" cy="${110 + Math.sin(a) * 52}" rx="30" ry="22" transform="rotate(${a * 180 / Math.PI} ${200 + Math.cos(a) * 52} ${110 + Math.sin(a) * 52})"`); }).join('');
    return [v >= 2 ? SKY + GROUND : '', v >= 3 ? SUN(345, 50) + R('path', 'd="M60 70q-25-25-30 5q-5 30 30 0zM60 70q25-25 30 5q5 30-30 0z"') + K('M60 60v25') : '',
      R('path', 'd="M195 150h10v100h-10z"'), R('path', 'd="M200 220C170 200 150 210 140 230C165 235 185 232 200 220Z"'), R('path', 'd="M200 200C230 180 250 190 260 210C235 215 215 212 200 200Z"'),
      pet, R('circle', 'cx="200" cy="110" r="30"'), v >= 2 ? R('path', 'd="M150 245H250L235 295H165Z"') : ''];
  } },
  { name: 'Roket', e: '🚀', draw: v => [
    v >= 2 ? R('rect', 'x="0" y="0" width="400" height="300"') + [[50, 50], [330, 40], [80, 230], [340, 220], [280, 120]].map(([x, y]) => R('circle', `cx="${x}" cy="${y}" r="5"`)).join('') : '',
    v >= 3 ? R('circle', 'cx="70" cy="150" r="38"') + R('ellipse', 'cx="70" cy="150" rx="62" ry="12"') + R('circle', 'cx="330" cy="120" r="22"') : '',
    R('path', 'd="M200 30C240 70 245 140 240 210H160C155 140 160 70 200 30Z"'), R('path', 'd="M160 160L125 215L160 210Z"'), R('path', 'd="M240 160L275 215L240 210Z"'), R('circle', 'cx="200" cy="110" r="22"'),
    v >= 1 ? R('path', 'd="M170 210Q200 290 230 210Z"') + R('path', 'd="M182 210Q200 255 218 210Z"') + R('path', 'd="M176 60Q200 40 224 60Z"') : '',
  ] },
  { name: 'Kedi', e: '🐱', draw: v => [
    v >= 3 ? R('rect', 'x="0" y="0" width="400" height="300"') + R('rect', 'x="260" y="30" width="110" height="90"') + K('M315 30v90M260 75h110') : '', v >= 2 ? R('rect', 'x="0" y="240" width="400" height="60"') + R('circle', 'cx="80" cy="235" r="22"') + K('M62 228q18 10 36-6M64 245q16-6 34 4') : '',
    v >= 3 ? R('ellipse', 'cx="200" cy="262" rx="130" ry="22"') : '',
    R('path', 'd="M270 225Q330 210 320 150Q315 135 305 150Q310 200 262 205Z"'), R('ellipse', 'cx="200" cy="200" rx="75" ry="50"'), R('circle', 'cx="200" cy="120" r="55"'),
    R('path', 'd="M150 95L158 45L190 72Z"'), R('path', 'd="M250 95L242 45L210 72Z"'),
    v >= 1 ? R('path', 'd="M160 85L163 60L180 75Z"') + R('path', 'd="M240 85L237 60L220 75Z"') + R('path', 'd="M192 132h16l-8 9z"') : '', D(180, 115, 7), D(220, 115, 7), K('M200 141q-10 12-20 6M200 141q10 12 20 6M150 135h-30M150 145l-28 8M250 135h30M250 145l28 8'),
  ] },
  { name: 'Balonlar', e: '🎈', draw: v => {
    const B = v >= 1 ? [[110, 90], [170, 60], [230, 80], [290, 100], [200, 130]] : [[140, 90], [210, 70], [270, 105]];
    return [v >= 2 ? SKY + CLOUD(30, 40) + CLOUD(300, 200) : '', v >= 3 ? R('path', 'd="M0 300V240Q100 190 200 240T400 230V300Z"') + SUN(60, 230) : '',
      B.map(([x, y]) => K(`M${x} ${y + 42}Q${x + 10} ${y + 90} 200 ${y >= 120 ? 255 : 260}`)).join(''), B.map(([x, y]) => R('ellipse', `cx="${x}" cy="${y}" rx="32" ry="40"`) + R('path', `d="M${x - 6} ${y + 40}h12l-6 9z"`)).join(''),
      v >= 1 ? R('rect', 'x="180" y="255" width="40" height="30" rx="6"') : ''];
  } },
  { name: 'Dinozor', e: '🦕', draw: v => [
    v >= 3 ? SKY + SUN(60, 50) : '', v >= 2 ? GROUND + R('path', 'd="M290 210L330 110H350L390 210Z"') + R('path', 'd="M326 120Q340 90 354 120Z"') : '',
    v >= 3 ? R('ellipse', 'cx="70" cy="245" rx="20" ry="26"') + K('M55 245l8-6l7 6l7-6l8 6') : '',
    R('path', 'd="M90 200Q60 190 40 215Q80 225 110 215Z"'), R('ellipse', 'cx="170" cy="190" rx="80" ry="45"'), R('path', 'd="M220 170Q250 120 245 75Q245 55 265 55Q290 55 290 75Q285 90 265 92Q268 140 245 190Z"'),
    R('rect', 'x="120" y="220" width="26" height="50" rx="10"'), R('rect', 'x="190" y="220" width="26" height="50" rx="10"'),
    v >= 1 ? [[120, 148], [150, 140], [180, 140], [210, 148]].map(([x, y]) => R('path', `d="M${x - 14} ${y + 6}L${x} ${y - 18}L${x + 14} ${y + 6}Z"`)).join('') + R('ellipse', 'cx="170" cy="205" rx="45" ry="18"') : '', D(273, 70, 5),
  ] },
];
const LEVELS = []; for (let v = 0; v < 4; v++) PICS.forEach((p, i) => LEVELS.push({ pic: i, v }));
const TIER = ['🌱 Kolay', '🌼 Orta', '🌈 Zor', '🏆 Usta'];
// ---------- Kayıt ----------
const KEY = 'robi_boyama';
let SB = { stars: {}, fills: {} }; try { SB = Object.assign(SB, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const sv = () => { try { localStorage.setItem(KEY, JSON.stringify(SB)); } catch (e) { SB.fills = {}; try { localStorage.setItem(KEY, JSON.stringify(SB)); } catch (e2) {} } };
const doneCount = () => Object.keys(SB.stars).length;
const unlocked = n => n === 0 || SB.stars[n - 1] || (RO.load && RO.load().unlockAll);
// ---------- Bölüm seçimi ----------
function renderSelect() {
  $('select').style.display = 'flex'; $('paint').style.display = 'none';
  $('total').textContent = `⭐ ${Object.values(SB.stars).reduce((a, b) => a + b, 0)} · ${doneCount()}/40`;
  let h = '';
  LEVELS.forEach((L, n) => { if (n % 10 === 0) h += `<div class="tier">${TIER[n / 10]}</div>`; const st = SB.stars[n], op = unlocked(n); h += `<button class="lv ${op ? '' : 'lock'} ${st ? 'done' : ''}" data-n="${n}"><i>${op ? PICS[L.pic].e : '🔒'}</i>${n + 1}<small>${st ? '★'.repeat(st) : '&nbsp;'}</small></button>`; });
  $('levels').innerHTML = h;
  $('levels').querySelectorAll('.lv').forEach(b => b.onclick = () => { const n = +b.dataset.n; if (!unlocked(n)) { tone(160, .2, 'sawtooth'); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 250 }); return; } openLevel(n); });
}
// ---------- Boyama ----------
let cur = 0, color = COLORS[0], hist = [];
function openLevel(n) {
  cur = n; hist = []; const L = LEVELS[n], P = PICS[L.pic];
  $('select').style.display = 'none'; $('paint').style.display = 'flex';
  $('title').textContent = `${n + 1}. bölüm · ${P.e} ${P.name} · ${TIER[L.v]}`;
  $('svgWrap').innerHTML = `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">${P.draw(L.v).join('')}</svg>`;
  const regs = [...$('svgWrap').querySelectorAll('.r')];
  const saved = SB.fills[n]; if (saved) regs.forEach((el, i) => saved[i] && el.setAttribute('fill', saved[i]));
  regs.forEach((el, i) => el.addEventListener('pointerdown', e => { e.preventDefault(); const old = el.getAttribute('fill'); if (old === color) return; hist.push([i, old]); el.setAttribute('fill', color); tone(500 + COLORS.indexOf(color) * 60, .08); el.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 200 }); progress(); }));
  progress();
}
function regs() { return [...$('svgWrap').querySelectorAll('.r')]; }
function progress() { const rs = regs(), c = rs.filter(e => e.getAttribute('fill') !== '#fff').length; $('prog').firstChild.style.width = (c / rs.length * 100) + '%'; SB.fills[cur] = rs.map(e => e.getAttribute('fill') === '#fff' ? 0 : e.getAttribute('fill')); sv(); }
$('pal').innerHTML = COLORS.map(c => `<button class="c ${c === color ? 'on' : ''}" style="background:${c}" data-c="${c}"></button>`).join('');
$('pal').querySelectorAll('.c').forEach(b => b.onclick = () => { color = b.dataset.c; $('pal').querySelectorAll('.c').forEach(x => x.classList.toggle('on', x === b)); tone(700, .05); });
$('undo').onclick = () => { const h = hist.pop(); if (!h) return; regs()[h[0]].setAttribute('fill', h[1]); progress(); tone(300, .08); };
$('clear').onclick = () => { regs().forEach(e => e.setAttribute('fill', '#fff')); hist = []; progress(); };
$('toSel').onclick = renderSelect;
$('back').onclick = () => { try { if (window.parent !== window) { parent.postMessage('robi-menu', '*'); return; } } catch (e) {} location.href = 'index.html'; };
$('done').onclick = () => {
  const rs = regs(), empty = rs.filter(e => e.getAttribute('fill') === '#fff' && !e.closest('[data-white]'));
  const filled = rs.length - empty.length;
  if (filled < rs.length) { empty.forEach(e => e.animate([{ fill: '#ffd166' }, { fill: '#fff' }], { duration: 500, iterations: 3 })); tone(200, .2, 'sawtooth'); $('title').textContent = `🖍️ ${empty.length} boş yer kaldı! Parlayan yerleri boya.`; return; }
  const kinds = new Set(rs.map(e => e.getAttribute('fill'))).size;
  const stars = kinds >= 5 ? 3 : kinds >= 3 ? 2 : 1;
  SB.stars[cur] = Math.max(SB.stars[cur] || 0, stars); sv();
  if (doneCount() >= 10) RO.award && RO.award('painter');
  party(stars, kinds);
};
// ---------- Kutlama: Robi ve hayvanlar dans eder ----------
function party(stars, kinds) {
  $('party').style.display = 'flex';
  $('pTitle').textContent = ['Güzel!', 'Çok güzel!', 'MUHTEŞEM!'][stars - 1];
  $('pStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  $('pMsg').textContent = stars < 3 ? `${kinds} renk kullandın. 5 farklı renk kullanırsan 3 yıldız!` : `${kinds} renkle harika bir resim! Robi ve arkadaşları çok mutlu!`;
  const robi = `<svg class="robi" viewBox="0 0 120 150"><line x1="60" y1="14" x2="60" y2="30" stroke="#2b2340" stroke-width="5"/><circle cx="60" cy="11" r="8" fill="#ff7a2f" stroke="#2b2340" stroke-width="3"/><rect x="22" y="28" width="76" height="54" rx="15" fill="#f4f6fb" stroke="#2b2340" stroke-width="5"/><rect x="32" y="42" width="56" height="26" rx="11" fill="#2b2340"/><path d="M41 56q6-8 12 0M67 56q6-8 12 0" stroke="#38e1ff" stroke-width="5" fill="none"/><rect x="32" y="86" width="56" height="38" rx="10" fill="#ff5ad8" stroke="#2b2340" stroke-width="5"/><g class="arm" style="transform-origin:28px 90px"><rect x="8" y="64" width="16" height="32" rx="8" fill="#f4f6fb" stroke="#2b2340" stroke-width="4"/></g><g class="arm" style="transform-origin:92px 90px;animation-direction:alternate-reverse"><rect x="96" y="64" width="16" height="32" rx="8" fill="#f4f6fb" stroke="#2b2340" stroke-width="4"/></g><rect x="40" y="124" width="14" height="18" rx="6" fill="#2b2340"/><rect x="66" y="124" width="14" height="18" rx="6" fill="#2b2340"/></svg>`;
  const an = ['🐰', '🦊', '🐢', '🐶', '🐦', '🦌'].map((e, i) => { const a = i / 6 * Math.PI * 2; return `<span class="an" style="left:calc(50% + ${Math.cos(a) * 140 - 20}px);top:${60 + Math.sin(a) * 45}px;animation-delay:${i * .08}s">${e}</span>`; }).join('');
  $('stage').innerHTML = robi + an;
  const box = $('party').querySelector('.box'); box.querySelectorAll('.conf').forEach(c => c.remove());
  for (let i = 0; i < 40; i++) { const c = document.createElement('i'); c.className = 'conf'; c.style.left = Math.random() * 100 + '%'; c.style.background = COLORS[i % 8]; c.style.animationDuration = 1.4 + Math.random() + 's'; c.style.animationDelay = Math.random() * .5 + 's'; box.appendChild(c); }
  [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .18, 'square', .05, i * .12));
  try { const v = RO.voices && RO.voices(); if (v && v.power) { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); setTimeout(() => RO.playVoice(AC, 'power'), 900); } } catch (e) {}
  $('next').style.display = cur < 39 ? '' : 'none';
}
$('again').onclick = () => { $('party').style.display = 'none'; $('clear').onclick(); };
$('next').onclick = () => { $('party').style.display = 'none'; openLevel(cur + 1); };
setInterval(() => { if (document.hidden) return; if (RO.tick(5) <= 0) { document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b2340;color:#fff;font-weight:800;font-size:24px;text-align:center"><div style="font-size:70px">😴🌙</div>Robi\'nin uyku zamanı!<br><small>Bugünlük oyun süresi bitti.</small></div>'; } }, 5000);
renderSelect();
</script>
