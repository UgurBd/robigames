<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robi Sanat Atölyesi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#fff7e0;background-image:radial-gradient(#ffd16655 2px,transparent 2px);background-size:22px 22px;touch-action:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{border:3.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:16px;padding:4px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:#22b573;color:#fff;text-shadow:0 1px 0 var(--ink)}
.scr{position:fixed;inset:0;display:none;padding:8px}
h1{margin:0;font-size:30px;color:#ff5ad8;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);line-height:1}
.top{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between}
/* ana ekran */
#home{flex-direction:column;align-items:center;justify-content:center;gap:14px}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mode{width:min(30vw,230px);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);background:#fff;padding:0;overflow:hidden;text-align:center}
.mode .art{height:min(30vh,120px);display:flex;align-items:center;justify-content:center;font-size:min(13vh,56px);border-bottom:4px solid var(--ink)}
.mode b{display:block;font-size:20px;margin-top:4px}.mode small{display:block;font-size:13px;color:#5a4f70;font-weight:700;padding:0 8px 8px}
/* bölüm listeleri */
#select,#tsel{flex-direction:column;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;width:min(860px,100%);overflow-y:auto;padding:4px;flex:1;align-content:start}
.lv{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:17px;padding:3px 0;line-height:1.05}
.lv small{display:block;font-size:11px;letter-spacing:-1px;color:#f5b400}.lv i{display:block;font-style:normal;font-size:18px}
.lv.lock{background:#e9e5f2;color:#999}.lv.done{background:#fff3c4}
.tier{grid-column:1/-1;font-weight:800;font-size:14px;text-align:left;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:15px;padding:1px 12px}
.tab.on{background:#ffd166;box-shadow:0 3px 0 var(--ink)}
/* boyama / çizim tuvali */
#paint,#trace,#studio{gap:10px}
.board{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.wrap{flex:1;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);overflow:hidden;position:relative;min-height:0}
.wrap svg{position:absolute;inset:0;width:100%;height:100%}
.wrap .r{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.wrap .ink{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;pointer-events:none}
.wrap .dot{fill:var(--ink);pointer-events:none}
.bar{display:flex;gap:6px;align-items:center}.bar .t{font-weight:800;font-size:16px;flex:1;line-height:1.1}
.side{width:178px;display:flex;flex-direction:column;gap:7px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;border:3.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px;padding:8px}
.c{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0}
.c.on{transform:scale(1.15) translateY(-2px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.side .btn{width:100%}
.prog{height:14px;border:3px solid var(--ink);border-radius:8px;background:#eee;overflow:hidden;width:160px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff5ad8);transition:width .2s}
/* çizim (izleme) */
.guide{fill:none;stroke:#9a8fb0;stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;stroke-linejoin:round}
.guide.glyph{stroke-width:7;stroke-dasharray:4 12}
.pen{fill:none;stroke-linecap:round;stroke-linejoin:round}
.start{fill:#22b573;stroke:var(--ink);stroke-width:3}
.label{position:absolute;left:0;right:0;text-align:center;font-weight:800;pointer-events:none;text-shadow:0 2px 0 #fff}
.label.en{top:6px;font-size:22px;color:#2e8bff}.label.tr{bottom:6px;font-size:26px;color:#e53935}
.speak{position:absolute;right:8px;top:8px;z-index:2;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:#ffd166;box-shadow:0 3px 0 var(--ink);font-size:22px}
/* serbest atölye */
#studio .shelf{width:132px;background:#fff;border:3.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px;padding:6px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
.thumb{border:2.5px solid var(--ink);border-radius:12px;background:#fff7e0;font-size:26px;padding:2px 0;line-height:1;touch-action:none}
.thumb small{display:block;font-size:9px;font-weight:800}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#topc{pointer-events:none}#objs{pointer-events:none}#objs g.o{pointer-events:auto}
#objs g.o.sel>.selbox{display:block}
.selbox{display:none;fill:none;stroke:#ff5ad8;stroke-width:3;stroke-dasharray:8 6}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tool{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--ink);font-size:20px;padding:2px 0;line-height:1.05}
.tool small{display:block;font-size:10px;font-weight:800}
.tool.on{background:#ffd166;transform:translateY(-2px)}
#sNet{display:flex;gap:5px;align-items:center}#sNet span{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 7px;font-weight:800}#sNet button{border:3px solid var(--ink);border-radius:12px;background:#ffd166;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.rcur{position:absolute;z-index:4;font-size:34px;pointer-events:none;transform:translate(-50%,-60%);transition:left .08s linear,top .08s linear,opacity .4s;filter:drop-shadow(0 2px 0 #fff)}
#bubble{position:absolute;z-index:3;pointer-events:none;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:14px;padding:2px 10px;text-align:center;font-weight:800;display:none;transform:translate(-50%,-100%)}
#bubble .en{color:#2e8bff;font-size:14px;display:block}#bubble .tr{color:#e53935;font-size:17px;display:block}
/* kutlama */
#party{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.45);z-index:10}
#party .box{background:#fff;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);border-radius:26px;padding:10px 18px 14px;text-align:center;width:min(560px,94vw);position:relative;overflow:hidden}
#party h2{margin:0;font-size:34px;color:#ff5ad8;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.stars{font-size:38px;letter-spacing:6px}
.stage2{position:relative;height:150px;margin:4px auto 6px;width:100%}
.stage2 .robi{position:absolute;left:50%;top:10px;width:84px;margin-left:-42px;animation:jumpy .6s ease-in-out infinite}
.stage2 .an{position:absolute;font-size:38px;animation:hop .5s ease-in-out infinite}
@keyframes jumpy{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px) scale(1.1)}}
.arm{animation:wave .3s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.conf{position:absolute;top:-20px;width:9px;height:13px;border:2px solid var(--ink);border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(540deg)}}
</style>
</head>
<body>
<!-- ANA -->
<div class="scr" id="home">
  <div class="top" style="max-width:860px"><button class="btn" id="back">🏠 Menü</button><h1>🎨 Sanat Atölyesi</h1><span class="btn" id="hstat">⭐ 0</span></div>
  <div class="modes">
    <button class="mode" data-go="select"><div class="art" style="background:conic-gradient(#e53935,#ffd166,#22b573,#2e8bff,#a259ff,#e53935)">🖍️</div><b>Boyama</b><small>120 bölüm · arka plan da boyanır</small></button>
    <button class="mode" data-go="tsel"><div class="art" style="background:#e8f4ff">✏️</div><b>Çizim Odası</b><small>Kesik çizgilerin üstünden geç, boyama hakkı kazan</small></button>
    <button class="mode" data-go="studio"><div class="art" style="background:#ffe3f1">🖌️</div><b>Serbest Atölye</b><small>Nesneleri sürükle, çiz, boya · Türkçe & English</small></button>
  </div>
</div>
<!-- BOYAMA BÖLÜMLERİ -->
<div class="scr" id="select">
  <div class="top" style="max-width:860px"><button class="btn" data-go="home">◀ Atölye</button><h1>🖍️ Boyama</h1><span class="btn" id="total">⭐ 0</span></div>
  <div class="grid" id="levels"></div>
</div>
<!-- BOYAMA -->
<div class="scr" id="paint" style="display:none">
  <div class="board">
    <div class="bar"><button class="btn" id="toSel">◀</button><span class="t" id="title"></span><button class="btn" id="pSpeak" style="padding:2px 8px">🔊</button><div class="prog" id="prog"><i></i></div></div>
    <div class="wrap" id="svgWrap"></div>
  </div>
  <div class="side">
    <div class="pal" id="pal"></div>
    <button class="btn" id="undo">↩️ Geri al</button>
    <button class="btn" id="clear">🧽 Temizle</button>
    <button class="btn go" id="done">✅ Bitti!</button>
  </div>
</div>
<!-- ÇİZİM SEÇİMİ -->
<div class="scr" id="tsel">
  <div class="top" style="max-width:860px"><button class="btn" data-go="home">◀ Atölye</button><h1>✏️ Çizim Odası</h1><span class="btn" id="tstat">✏️ 0</span></div>
  <div class="tabs" id="ttabs"></div>
  <div class="grid" id="tgrid" style="grid-template-columns:repeat(auto-fill,minmax(76px,1fr))"></div>
</div>
<!-- ÇİZİM -->
<div class="scr" id="trace">
  <div class="board">
    <div class="bar"><button class="btn" id="tBack">◀</button><span class="t" id="tTitle"></span><div class="prog" id="tprog"><i></i></div></div>
    <div class="wrap" id="tWrap"><button class="speak" id="tSpeak">🔊</button><div class="label en" id="tEn"></div><div class="label tr" id="tTr"></div></div>
  </div>
  <div class="side">
    <div class="pal" id="tpal"></div>
    <div class="tools" id="tsize"></div>
    <button class="btn" id="tClear">🧽 Sil, baştan</button>
    <button class="btn go" id="tCheck">✅ Bitti!</button>
  </div>
</div>
<!-- SERBEST -->
<div class="scr" id="studio">
  <div class="shelf" id="shelf"></div>
  <div class="board">
    <div class="bar"><button class="btn" data-go="home">◀</button><span class="t">🖌️ Serbest Atölye <small style="color:#5a4f70">· nesneyi sürükle bırak, dokun: adını duy</small></span><span id="sNet"></span><button class="btn" id="sSave">📸 Albüme</button></div>
    <div class="wrap" id="stage"><canvas id="bgc"></canvas><svg id="objs" viewBox="0 0 800 450"></svg><canvas id="topc"></canvas><div id="bubble"></div></div>
  </div>
  <div class="side">
    <div class="tools" id="stools"></div>
    <div class="pal" id="spal"></div>
    <div class="tools"><button class="tool" id="oBig">➕<small>Büyüt</small></button><button class="tool" id="oSmall">➖<small>Küçült</small></button><button class="tool" id="oDel">🗑️<small>Sil</small></button></div>
    <button class="btn" id="sClear">🧽 Hepsini temizle</button>
  </div>
</div>
<!-- KUTLAMA -->
<div id="party"><div class="box">
  <h2 id="pTitle"></h2><div class="stars" id="pStars"></div>
  <div class="stage2" id="stage2"></div>
  <div id="pMsg" style="font-weight:800;margin-bottom:8px"></div>
  <div style="display:flex;gap:8px;justify-content:center" id="pBtns"></div>
</div></div>
<script src="ortak.js"></script>
<script src="kutuphane.js"></script>
<script src="analiz.js"></script>
<script src="net.js"></script>
<script>
const $ = id => document.getElementById(id);
const RO = window.RobiOrtak || { award: () => null, tick: () => Infinity, load: () => ({}), addPhoto: () => true };
const KB = window.RobiKutuphane;
const AN = window.RobiAnaliz || { screen() {}, done() {}, ev() {}, btn() {}, interstitial(f) { f(); } };
const COLORS = ['#e53935', '#ff7a2f', '#ffd166', '#22b573', '#2bd4c4', '#2e8bff', '#a259ff', '#ff5ad8', '#8b5a2b', '#ffffff', '#9aa3ad', '#2b2340'];
let AC = null;
function tone(f, d = .1, type = 'triangle', vol = .07, t0 = 0) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} }
const SCREENS = ['home', 'select', 'paint', 'tsel', 'trace', 'studio'];
function show(id) { AN.screen('atolye:' + id); SCREENS.forEach(s => $(s).style.display = s === id ? 'flex' : 'none'); if (id === 'select') renderSelect(); if (id === 'tsel') renderTsel(); if (id === 'studio') studioInit(); if (id === 'home') renderHome(); }
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tone(660, .06); if (SNETH && b.dataset.go === 'home') { $('back').onclick(); return; } show(b.dataset.go); });
$('back').onclick = () => { try { if (window.parent !== window) { parent.postMessage('robi-menu', '*'); return; } } catch (e) {} location.href = 'index.html'; };

// ---------- Resimler (10 resim × 4 zorluk = 40 bölüm) ----------
// r(): boyanabilir bölge, k(): çizgi, d(): siyah nokta
const r = s => `<g class="R">${s}</g>`;
const R = (tag, a) => `<${tag} class="r" fill="#fff" ${a}/>`;
const K = a => `<path class="ink" d="${a}"/>`;
const D = (x, y, rr = 5) => `<circle class="dot" cx="${x}" cy="${y}" r="${rr}"/>`;
const SKY = R('rect', 'x="0" y="0" width="400" height="210"'), GROUND = R('rect', 'x="0" y="210" width="400" height="90"');
const SUN = (x = 340, y = 55) => R('circle', `cx="${x}" cy="${y}" r="30"`) + K(`M${x} ${y - 42}v-12M${x} ${y + 42}v12M${x - 42} ${y}h-12M${x + 42} ${y}h12`);
const CLOUD = (x, y) => R('path', `d="M${x} ${y}a18 18 0 0 1 30-14a22 22 0 0 1 40 6a16 16 0 0 1 4 32h-70a16 16 0 0 1-4-24z"`);
const PICS = [
  { name: 'Ev', e: '🏠', draw: v => [
    v >= 2 ? SKY + GROUND : '', v >= 2 ? SUN() : '', v >= 3 ? CLOUD(40, 40) + CLOUD(170, 30) : '',
    R('rect', 'x="110" y="130" width="170" height="120"'), R('path', 'd="M95 132L195 55L295 132Z"'), R('rect', 'x="175" y="180" width="42" height="70" rx="6"'),
    v >= 1 ? R('rect', 'x="125" y="150" width="38" height="34"') + R('rect', 'x="230" y="150" width="38" height="34"') + R('rect', 'x="240" y="68" width="22" height="40"') : '',
    v >= 3 ? R('path', 'd="M175 250L150 300H245L217 250Z"') + R('rect', 'x="30" y="160" width="14" height="60"') + R('circle', 'cx="37" cy="150" r="30"') : '',
  ] },
  { name: 'Balık', e: '🐟', draw: v => [
    v >= 2 ? R('rect', 'x="0" y="0" width="400" height="300"') : '', v >= 2 ? R('circle', 'cx="330" cy="70" r="12"') + R('circle', 'cx="350" cy="40" r="8"') + R('circle', 'cx="315" cy="35" r="6"') : '',
    v >= 3 ? R('path', 'd="M40 300C20 240 70 230 50 170C80 220 60 250 75 300Z"') + R('path', 'd="M350 300C340 250 380 240 365 190C395 230 380 260 385 300Z"') + R('ellipse', 'cx="320" cy="230" rx="26" ry="14"') + R('path', 'd="M294 230l-18-12v24z"') : '',
    R('path', 'd="M265 150l70-50v100z"'), v >= 1 ? R('path', 'd="M110 150C120 95 200 85 265 150C200 215 120 205 110 150Z"') + R('path', 'd="M160 120C170 105 190 100 205 107L200 130Z"') + K('M190 112C200 150 200 170 188 192M225 120C235 150 234 170 225 185') : R('path', 'd="M110 150C120 95 200 85 265 150C200 215 120 205 110 150Z"'),
    R('path', 'd="M170 105C185 70 220 75 225 115Z"'), R('path', 'd="M180 195C190 225 215 225 220 190Z"'), R('circle', 'cx="145" cy="140" r="12"'), D(147, 140, 5),
  ] },
  { name: 'Ağaç', e: '🌳', draw: v => [
    v >= 2 ? SKY + GROUND : '', v >= 3 ? SUN(60, 55) + R('path', 'd="M300 60q10-10 20 0q10-10 20 0"') : '',
    R('path', 'd="M180 280L190 170H215L225 280Z"'), R('circle', 'cx="202" cy="125" r="80"'),
    v >= 1 ? R('circle', 'cx="165" cy="105" r="13"') + R('circle', 'cx="235" cy="120" r="13"') + R('circle', 'cx="200" cy="160" r="13"') + R('circle', 'cx="215" cy="80" r="13"') : '',
    v >= 3 ? [60, 110, 300, 345].map(x => R('circle', `cx="${x}" cy="265" r="11"`) + K(`M${x} 276v18`)).join('') : '',
  ] },
  { name: 'Robi', e: '🤖', draw: v => [
    v >= 2 ? R('rect', 'x="0" y="0" width="400" height="300"') : '', v >= 3 ? [[40, 40], [350, 60], [70, 240], [330, 250], [300, 30]].map(([x, y]) => R('path', `d="M${x} ${y - 14}l4 10l10 2l-8 7l2 11l-8-6l-8 6l2-11l-8-7l10-2z"`)).join('') : '',
    R('rect', 'x="140" y="55" width="120" height="85" rx="22"'), R('rect', 'x="150" y="150" width="100" height="85" rx="18"'), R('rect', 'x="165" y="235" width="26" height="45" rx="10"'), R('rect', 'x="210" y="235" width="26" height="45" rx="10"'),
    v >= 1 ? R('rect', 'x="157" y="75" width="86" height="40" rx="16"') + R('circle', 'cx="200" cy="30" r="12"') + K('M200 42v13') + R('rect', 'x="110" y="155" width="28" height="70" rx="12"') + R('rect', 'x="262" y="155" width="28" height="70" rx="12"') : R('circle', 'cx="180" cy="97" r="11"') + R('circle', 'cx="220" cy="97" r="11"'),
    v >= 1 ? R('circle', 'cx="180" cy="95" r="10"') + R('circle', 'cx="220" cy="95" r="10"') : '',
    v >= 2 ? R('rect', 'x="150" y="200" width="100" height="16"') + R('circle', 'cx="200" cy="178" r="12"') : '',
  ] },
  { name: 'Araba', e: '🚗', draw: v => [
    v >= 2 ? SKY + R('rect', 'x="0" y="225" width="400" height="75"') + K('M20 262h40M100 262h40M180 262h40M260 262h40M340 262h40') : '', v >= 3 ? SUN(60, 55) + CLOUD(250, 40) + R('rect', 'x="345" y="150" width="12" height="75"') + R('circle', 'cx="351" cy="135" r="28"') : '',
    R('path', 'd="M70 220V170Q75 155 95 152L130 150L160 110H260L295 150L330 155Q345 160 345 175V220Z"'), R('path', 'd="M168 120H210V150H145Z"'), R('path', 'd="M220 120H255L280 150H220Z"'),
    R('circle', 'cx="125" cy="222" r="28"'), R('circle', 'cx="290" cy="222" r="28"'),
    v >= 1 ? R('circle', 'cx="125" cy="222" r="11"') + R('circle', 'cx="290" cy="222" r="11"') + R('rect', 'x="328" y="170" width="16" height="12" rx="4"') + R('rect', 'x="70" y="172" width="14" height="12" rx="4"') + K('M215 152V210') : '',
  ] },
  { name: 'Çiçek', e: '🌸', draw: v => {
    const n = v >= 1 ? 8 : 5, pet = Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2; return R('ellipse', `cx="${200 + Math.cos(a) * 52}" cy="${110 + Math.sin(a) * 52}" rx="30" ry="22" transform="rotate(${a * 180 / Math.PI} ${200 + Math.cos(a) * 52} ${110 + Math.sin(a) * 52})"`); }).join('');
    return [v >= 2 ? SKY + GROUND : '', v >= 3 ? SUN(345, 50) + R('path', 'd="M60 70q-25-25-30 5q-5 30 30 0zM60 70q25-25 30 5q5 30-30 0z"') + K('M60 60v25') : '',
      R('path', 'd="M195 150h10v100h-10z"'), R('path', 'd="M200 220C170 200 150 210 140 230C165 235 185 232 200 220Z"'), R('path', 'd="M200 200C230 180 250 190 260 210C235 215 215 212 200 200Z"'),
      pet, R('circle', 'cx="200" cy="110" r="30"'), v >= 2 ? R('path', 'd="M150 245H250L235 295H165Z"') : ''];

function objState(g) { return { u: g.dataset.uid, id: g.dataset.id, x: +(+g.dataset.x / 800).toFixed(4), y: +(+g.dataset.y / VH).toFixed(4), s: +(+g.dataset.s).toFixed(3), r: +(+g.dataset.r || 0).toFixed(1) }; }
function netObj(kind, g) { if (SNET && g) netSend({ t: kind, ...objState(g) }); }
let mvT = 0; function netMoveSoon(g) { if (!SNET || mvT) return; mvT = setTimeout(() => { mvT = 0; netObj('mv', g); }, 70); }
const findObj = u => [...document.querySelectorAll('#objs g.o')].find(g => g.dataset.uid === u);
if (SNETH) (function () {
  const RN = window.RobiNet, code = SNETH[1], SERVER = window.ROBI_SERVER;
  const N = SNET = { code, me: -1, peers: {}, ws: null };
  const isHost = () => Object.keys(N.peers).every(s => +s > N.me);
  function hud() { $('sNet').innerHTML = `<span>🔑 ${code.slice(0, 2)}-${code.slice(2)}</span>` + [N.me, ...Object.keys(N.peers).map(Number)].filter(s => s >= 0).sort().map(s => `<span style="border-color:${RN.COL[s]};${s === N.me ? `background:${RN.COL[s]};color:#fff` : ''}">${RN.AV[s]}</span>`).join('') + `<button id="sInv">📨 Davet</button>`; $('sInv').onclick = () => { try { parent.postMessage(`robi-invite:boya:${code}`, '*'); } catch (e) {} }; }
  function cursor(s, nx, ny) { const st = $('stage').getBoundingClientRect(); let c = $('cur' + s); if (!c) { c = document.createElement('div'); c.id = 'cur' + s; c.className = 'rcur'; c.textContent = RN.AV[s]; $('stage').appendChild(c); } c.style.left = nx * st.width + 'px'; c.style.top = ny * st.height + 'px'; c.style.opacity = 1; clearTimeout(c._t); c._t = setTimeout(() => c.style.opacity = 0, 1500); }
  function joinParty(s) { const b = $('bubble'); b.style.display = 'block'; b.style.left = '50%'; b.style.top = '70px'; b.innerHTML = `<span class="tr">🎉 ${RN.AV[s]} geldi! Birlikte boyayalım!</span>`; setTimeout(() => b.style.display = 'none', 2200); [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .07, i * .09)); [880, 1046, 932, 1174, 988, 1318].forEach((f, i) => tone(f, .08, 'sine', .05, .45 + i * .08)); KB.speak('Yaşasın! Arkadaşın geldi!', 'tr-TR'); }
  function apply(s, m) {
    const c = $('topc');
    if (m.t === 'sg') { for (const [ax, ay, bx, by] of m.s) drawSeg(m.tool, m.c, ax * c.width, ay * c.height, bx * c.width, by * c.height, c.width / $('stage').getBoundingClientRect().width, m.h); const l = m.s[m.s.length - 1]; if (l) cursor(s, l[2], l[3]); }
    else if (m.t === 'ff') { floodFill(m.x * c.width, m.y * c.height, m.c, true); cursor(s, m.x, m.y); }
    else if (m.t === 'add') { if (!findObj(m.u)) addObj(m.id, m.x * 800, m.y * VH, { uid: m.u, s: m.s, r: m.r }); }
    else if (m.t === 'mv') { const g = findObj(m.u); if (g) { g.dataset.x = m.x * 800; g.dataset.y = m.y * VH; g.dataset.s = m.s; g.dataset.r = m.r; placeObj(g); cursor(s, m.x, m.y * VH / VH); } else addObj(m.id, m.x * 800, m.y * VH, { uid: m.u, s: m.s, r: m.r }); }
    else if (m.t === 'del') { const g = findObj(m.u); if (g) { if (g === selObj) select(null); g.remove(); } }
    else if (m.t === 'fr') { const g = findObj(m.u); const r = g && g.querySelectorAll('.r')[m.i]; if (r) { r.setAttribute('fill', m.c); r.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 200 }); } }
    else if (m.t === 'clr') clearAll();
    else if (m.t === 'snap' && m.to === N.me) {
      clearAll(); for (const o of m.objs) { const g = addObj(o.id, o.x * 800, o.y * VH, { uid: o.u, s: o.s, r: o.r }); g.querySelectorAll('.r').forEach((r, i) => o.f[i] && r.setAttribute('fill', o.f[i])); }
      if (m.img) { const im = new Image(); im.onload = () => { const b = $('bgc'); b.getContext('2d').drawImage(im, 0, 0, b.width, b.height); }; im.src = m.img; }
    }
  }
  function snapFor(to) {
    const W = 640, b = $('bgc'), H = Math.round(W * b.height / b.width), cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(b, 0, 0, W, H); g.drawImage($('topc'), 0, 0, W, H);
    netSend({ t: 'snap', to, objs: [...document.querySelectorAll('#objs g.o')].map(g => ({ ...objState(g), f: [...g.querySelectorAll('.r')].map(r => r.getAttribute('fill') === '#fff' ? 0 : r.getAttribute('fill')) })), img: cv.toDataURL('image/jpeg', .6) });
  }
  function connect() {
    const ws = N.ws = new WebSocket(SERVER.replace(/^http/, 'ws') + `/ws?code=${code}&ch=boya&${RN.q()}${SNETH[2] && !N.in ? '&ask=1' : ''}`);
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'wait') { const b = $('bubble'); b.style.display = 'block'; b.style.left = '50%'; b.style.top = '45%'; b.innerHTML = '<span class="tr">⏳ Oda sahibine soruluyor...</span>'; KB.speak('Oda sahibine soruyorum, biraz bekle!', 'tr-TR'); }
      else if (m.t === 'denied') { N.closing = true; KB.speak('Oda sahibi şimdi izin vermedi.', 'tr-TR'); setTimeout(() => $('back').onclick(), 2000); }
      else if (m.t === 'ask') { const p = m.p, w = document.createElement('div'); w.style.cssText = 'position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(43,35,64,.65);color:#fff;font-weight:800;font-size:22px'; w.innerHTML = `<div style="font-size:64px">${p.av || '🙂'}</div><p>${p.name || 'Bir arkadaş'} girmek istiyor!</p><div><button class="btn go" data-ok="1">✅ Gelsin</button> <button class="btn" data-ok="0">❌ Hayır</button></div>`; document.body.appendChild(w); KB.speak(`${p.name || 'Bir arkadaş'} girmek istiyor! Gelsin mi?`, 'tr-TR'); w.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { netSend({ t: 'allow', slot: p.slot, ok: b.dataset.ok === '1' }); w.remove(); }); }
      else if (m.t === 'welcome') { N.in = true; $('bubble').style.display = 'none'; N.me = m.me.slot; m.peers.forEach(p => N.peers[p.slot] = 1); hud(); joinParty(N.me); }
      else if (m.t === 'join') { N.peers[m.p.slot] = 1; hud(); joinParty(m.p.slot); if (isHost()) setTimeout(() => snapFor(m.p.slot), 400); }
      else if (m.t === 'leave') { delete N.peers[m.slot]; hud(); }
      else if (m.m) apply(m.s, m.m); };
    ws.onclose = () => { if (!N.closing) setTimeout(connect, 1500); };
  }
  addEventListener('pagehide', () => { N.closing = true; try { N.ws.close(); } catch (e) {} });
  setTimeout(() => { show('studio'); const sm = document.querySelector('#studio .t small'); if (sm) sm.style.display = 'none'; setTimeout(connect, 300); }, 50);
})();


if (!SNETH) show('home');

</script>
